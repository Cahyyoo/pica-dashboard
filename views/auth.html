<div id="view-login" class="screen screen-center active">
    <div class="login-split-card">
        <form onsubmit="event.preventDefault(); handleLogin();" class="login-form-side">
            <div style="text-align: center; margin-bottom: 32px;">
                <img src="public\img\logo_pica.png" alt="Logo" width="170" style="margin-top: -50px; margin-bottom: -50px;">
                <h2 style="font-size: 26px; color: #111827;">Welcome Back!</h2>
                <p style="color: #6b7280; font-size: 14px; margin: 0; line-height: 1.5;">Sign in to continue managing your PICA reports efficiently.</p>
            </div>

            <div class="input-wrapper">
                <label>Username</label>
                <input type="text" id="username" placeholder="Input your username" autocomplete="off" autofocus>
            </div>

            <div class="input-wrapper" style="margin-bottom: 32px;">
                <label>Password</label>
                <input type="password" id="password" placeholder="Input your password">
            </div>

            <button type="submit" class="btn-login-main" onclick="handleLogin()">Sign In</button>
        </form>

        <div class="login-image-side" style="background-image: url(public/img/pit.jpeg); background-position: center; background-size: cover;">
            <div class="login-image-content">
                <h2 style="font-size: 32px; color: #ffffff; margin-bottom: 12px; line-height: 1.2;">Scale Your Work Faster</h2>
                <p style="color: rgba(255, 255, 255, 0.9); font-size: 15px; margin: 0; line-height: 1.6;">Join your team to track, manage, and resolve operational issues in one integrated dashboard platform.</p>
            </div>
        </div>

    </div>
</div>
