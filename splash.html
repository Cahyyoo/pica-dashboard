<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loading PICA System</title>
    <style>
        body {
            margin: 0; padding: 0; display: flex; flex-direction: column;
            justify-content: center; align-items: center; height: 100vh;
            
            /* Background Gradasi Tema Baru */
            background: linear-gradient(135deg, #80C8F6, #3957ED);
            
            color: white;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            border-radius: 12px; overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            border: 1px solid #3957ED;
        }

        /* --- STYLING KHUSUS UNTUK LOGO --- */
        .splash-logo {
            height: 150px; /* Ukuran logo cukup besar karena di tengah layar */
            object-fit: contain;
            margin-top: 0;
            /* margin-bottom: -70px; */
            
            /* Trik Kotak Putih Premium */
            filter: drop-shadow(0px 0px 30px rgba(255, 255, 255, 1)); 
        }

        .loader {
            border: 5px solid rgba(255, 255, 255, 0.2); border-top: 5px solid white;
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin-bottom: 20px;
            margin-top: -25px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        h2 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 2px; }
        p { margin-top: 8px; font-size: 13px; font-weight: 400; opacity: 0.8; letter-spacing: 1px; margin-bottom: 30px; }
    </style>
</head>
<body>
    
    <img src="public/img/logo_pica.png" alt="PICA Logo" class="splash-logo">
    
    <div class="loader"></div>
    <h2>PICA SYSTEM</h2>
    <p>INITIALIZING SECURE WORKSPACE...</p>
    
</body>
</html>
